name: Sync Master Repo

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.MASTER_SYNC_TOKEN }}  # Use PAT for private repos
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Sync backend from private repo
        run: |
          echo "Syncing backend repository..."
          git subtree pull --prefix=backend https://${{ secrets.MASTER_SYNC_TOKEN }}@github.com/ashik5757/Prothom_Alo_Scrapper.git main --squash || echo "No backend changes or first sync"

      - name: Sync frontend from private repo
        run: |
          echo "Syncing frontend repository..."
          git subtree pull --prefix=frontend https://${{ secrets.MASTER_SYNC_TOKEN }}@github.com/ashik5757/prothomalo_scrapping.git main --squash || echo "No frontend changes or first sync"

      - name: Commit and push changes
        run: |
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Sync repositories - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin master
            echo "Changes committed and pushed"
          else
            echo "No changes to commit"
          fi